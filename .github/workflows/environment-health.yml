name: Environment Health

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  doctor:
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: AgentOS doctor
        run: npm run doctor
