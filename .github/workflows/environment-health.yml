name: Environment Health

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1"

jobs:
  doctor:
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: AgentOS doctor
        run: npm run doctor
