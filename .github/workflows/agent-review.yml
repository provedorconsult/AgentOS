name: Agent Review Checklist

permissions:
  contents: read

on:
  pull_request:

jobs:
  checklist:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check required docs
        run: |
          test -f AGENTS.md
          test -f CLAUDE.md
          test -f docs/AGENT_ROSTER.md
          test -f docs/QUALITY.md
          test -f docs/SECURITY_GUARDRAILS.md
          test -f codex-layer/config.toml
