name: Deploy

permissions:
  contents: read

concurrency:
  group: agentos-deploy-blocked
  cancel-in-progress: false

on:
  workflow_dispatch:

jobs:
  deployment-blocked:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      # No checkout, environment reference, secrets, or deployment command.
      # Do not restore execution until protections and authorization are reviewed.
      - name: Deployment disabled pending independent administrative readback
        shell: pwsh
        run: throw "Deployment is disabled pending verified environment protections, human authorization, and independent review."
