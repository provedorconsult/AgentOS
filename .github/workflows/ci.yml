name: AgentOS CI

permissions:
  contents: read

concurrency:
  group: agentos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    timeout-minutes: 10
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Dependency audit
        run: npm audit --audit-level=moderate
      - name: Reachable-history secret scan
        run: npm run validate:secrets:history
      - name: Independent Gitleaks scan (pinned binary and checksum)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: bash scripts/run-gitleaks.sh
      - name: Doctor
        run: npm run doctor
      - name: Validate
        run: npm run validate
      - name: Diff hygiene
        run: git diff --check
      - name: Clean worktree
        shell: bash
        run: test -z "$(git status --porcelain)"
