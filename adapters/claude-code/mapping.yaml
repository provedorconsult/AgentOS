adapter:
  id: claude-code
  status: supported
  target_tool: Claude Code (VSCode extension and CLI)
  core_dependency: false
maps:
  instructions:
    from: adapters/claude-code/templates/CLAUDE.md
    to: CLAUDE.md
    status: supported
  agents:
    from: core/agents
    to: .claude/agents
    status: planned
  skills:
    from: core/skills
    to: .claude/skills
    status: planned
notes:
  - Installs CLAUDE.md only; it coexists with the Codex adapter and never touches .codex/ or AGENTS.md.
  - Do not make AgentOS core depend on Claude Code or .claude/.
  - Core files must remain IDE-neutral.
